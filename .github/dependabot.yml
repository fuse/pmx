# Dependabot version updates (free on public repos).
# Security updates are enabled separately via Terraform
# (infrastructure/github → github_repository_dependabot_security_updates).

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
