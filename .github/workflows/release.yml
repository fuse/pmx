name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${TAG}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X github.com/fuse/pmx/internal/cli.Version=${VERSION} \
            -X github.com/fuse/pmx/internal/cli.Commit=${COMMIT:0:7} \
            -X github.com/fuse/pmx/internal/cli.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o "dist/pmx${{ matrix.ext }}" ./cmd/pmx

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${TAG}"
          mkdir -p release
          if [ "${GOOS}" = "windows" ]; then
            zip -j "release/pmx_${VERSION}_${GOOS}_${GOARCH}.zip" dist/pmx.exe
          else
            tar -C dist -czf "release/pmx_${VERSION}_${GOOS}_${GOARCH}.tar.gz" pmx
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pmx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
